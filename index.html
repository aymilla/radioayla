<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RADIO AYLA | Music • Energy • Emotion</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --bg-color: #0b0c10;
      --card-bg: rgba(22, 27, 34, 0.75);
      --cyan: #00f2fe;
      --purple: #9b51e0;
      --magenta: #f107a3;
      --red-live: #ff2a2a;
      --text-main: #ffffff;
      --text-muted: #a0a5b5;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Montserrat', sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      background: radial-gradient(circle at top, #1a0933 0%, var(--bg-color) 70%);
      overflow-x: hidden;
      padding: 20px 15px;
    }

    /* Container Principale */
    .container {
      width: 100%;
      max-width: 500px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      margin: auto 0;
    }

    /* Indicatore ON AIR */
    .on-air-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(255, 42, 42, 0.15);
      border: 1px solid var(--red-live);
      color: var(--red-live);
      padding: 6px 16px;
      border-radius: 20px;
      font-weight: 800;
      font-size: 0.85rem;
      letter-spacing: 2px;
      margin-bottom: 25px;
      box-shadow: 0 0 15px rgba(255, 42, 42, 0.4);
    }

    .dot {
      width: 10px;
      height: 10px;
      background-color: var(--red-live);
      border-radius: 50%;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.3; transform: scale(0.8); }
      100% { opacity: 1; transform: scale(1); }
    }

    /* Logo / Header */
    .logo-container {
      margin-bottom: 20px;
    }

    .logo-img {
      width: 180px;
      height: 180px;
      border-radius: 20px;
      box-shadow: 0 0 30px rgba(0, 242, 254, 0.25), 0 0 50px rgba(241, 7, 163, 0.2);
      object-fit: cover;
      margin-bottom: 15px;
    }

    .brand-title {
      font-size: 2.8rem;
      font-weight: 900;
      letter-spacing: 2px;
      background: linear-gradient(135deg, var(--cyan), var(--magenta));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 20px rgba(0, 242, 254, 0.3);
      text-transform: uppercase;
    }

    .brand-slogan {
      font-size: 0.85rem;
      color: var(--text-muted);
      letter-spacing: 3px;
      font-weight: 600;
      margin-top: 5px;
      margin-bottom: 25px;
    }

    /* Generi Musicali Tag */
    .genres {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      margin-bottom: 30px;
    }

    .genre-tag {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 5px 12px;
      border-radius: 12px;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 1px;
      color: var(--cyan);
    }

    /* Card Player */
    .player-card {
      background: var(--card-bg);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 24px;
      padding: 25px;
      width: 100%;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    .now-playing {
      margin-bottom: 20px;
    }

    .now-playing-label {
      font-size: 0.75rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1.5px;
      margin-bottom: 5px;
    }

    .now-playing-title {
      font-size: 1.1rem;
      font-weight: 700;
      color: #fff;
    }

    /* Controls */
    .controls {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
    }

    .play-btn {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      border: none;
      background: linear-gradient(135deg, var(--cyan), var(--magenta));
      color: #fff;
      font-size: 2rem;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 0 25px rgba(0, 242, 254, 0.5);
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .play-btn:hover {
      transform: scale(1.08);
      box-shadow: 0 0 35px rgba(241, 7, 163, 0.7);
    }

    .play-btn:active {
      transform: scale(0.95);
    }

    /* Volume Control */
    .volume-container {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 80%;
      margin-top: 10px;
    }

    .volume-container i {
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    .volume-slider {
      -webkit-appearance: none;
      width: 100%;
      height: 4px;
      border-radius: 2px;
      background: rgba(255, 255, 255, 0.2);
      outline: none;
    }

    .volume-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--cyan);
      cursor: pointer;
    }

    /* Footer */
    footer {
      margin-top: 30px;
      font-size: 0.75rem;
      color: var(--text-muted);
      letter-spacing: 1px;
    }
  </style>
</head>
<body>

  <div class="container">
    
    <!-- Indicatore LIVE -->
    <div class="on-air-badge">
      <div class="dot"></div>
      ON AIR
    </div>

    <!-- Header & Logo -->
    <div class="logo-container">
      <!-- Se salvi il logo su GitHub chiamalo logo.jpg, altrimenti puoi caricare un link dell'immagine -->
      <img src="Gemini_Generated_Image_ab3e4oab3e4oab3e (1).jpg" alt="Radio Ayla Logo" class="logo-img" onerror="this.style.display='none'">
      <h1 class="brand-title">RADIO AYLA</h1>
      <p class="brand-slogan">MUSIC • ENERGY • EMOTION</p>
    </div>

    <!-- Generi -->
    <div class="genres">
      <span class="genre-tag">🎧 EDM</span>
      <span class="genre-tag">💃 DANCE</span>
      <span class="genre-tag">✨ TRANCE</span>
      <span class="genre-tag">⚡ HARDSTYLE</span>
    </div>

    <!-- Player Box -->
    <div class="player-card">
      <div class="now-playing">
        <div class="now-playing-label">🎵 In riproduzione</div>
        <div class="now-playing-title" id="stream-status">Direct Live Stream</div>
      </div>

      <div class="controls">
        <button class="play-btn" id="playBtn" onclick="togglePlay()">
          <i class="fa-solid fa-play" id="playIcon" style="margin-left: 5px;"></i>
        </button>

        <div class="volume-container">
          <i class="fa-solid fa-volume-low"></i>
          <input type="range" id="volume" class="volume-slider" min="0" max="1" step="0.01" value="0.8" oninput="changeVolume(this.value)">
          <i class="fa-solid fa-volume-high"></i>
        </div>
      </div>
    </div>

  </div>

  <!-- Audio Element -->
  <audio id="radioStream" src="http://13.63.119.35:8000/radio" preload="none"></audio>

  <footer>
    &copy; 2026 RADIO AYLA • Web Radio Official Stream
  </footer>

  <script>
    const audio = document.getElementById('radioStream');
    const playBtn = document.getElementById('playBtn');
    const playIcon = document.getElementById('playIcon');
    const streamStatus = document.getElementById('stream-status');

    let isPlaying = false;

    function togglePlay() {
      if (isPlaying) {
        audio.pause();
        // Reset src per svuotare il buffer della diretta ed evitare ritardi al riavvio
        audio.src = ''; 
        playIcon.className = 'fa-solid fa-play';
        playIcon.style.marginLeft = '5px';
        streamStatus.textContent = 'In pausa';
        isPlaying = false;
      } else {
        audio.src = 'http://13.63.119.35:8000/radio';
        audio.play().then(() => {
          playIcon.className = 'fa-solid fa-pause';
          playIcon.style.marginLeft = '0px';
          streamStatus.textContent = 'Streaming Live...';
          isPlaying = true;
        }).catch(error => {
          console.error("Errore di riproduzione:", error);
          streamStatus.textContent = "Errore di connessione allo stream";
        });
      }
    }

    function changeVolume(val) {
      audio.volume = val;
    }
  </script>
</body>
</html>
